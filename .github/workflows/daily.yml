name: Daily Anthropic Scraper

on:
  schedule:
    - cron: '0 1 * * *'  # UTC 01:00 = CST 09:00
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: node scripts/scraper.js

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          git diff --staged --quiet || git commit -m "chore: update articles $(date +%Y-%m-%d) [skip ci]"
          git push

      - name: Deploy to Alibaba Cloud
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 8.130.50.40
          username: root
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "public/data/*.json,public/app.js,public/styles.css,public/index.html"
          strip_components: 1
          target: "/var/www/anthropic-news"
          overwrite: true
